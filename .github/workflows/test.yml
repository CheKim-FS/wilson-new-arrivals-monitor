name: Test Wilson Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4


      - name: Check Wilson mobile site
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Save new products
        run: |
          if git diff --quiet -- seen_products.txt; then
            echo "새로 저장할 상품 없음"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_products.txt
            git commit -m "Update seen Wilson products"
            git push
          fi

      - name: Send failure notification
        if: ${{ failure() }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl --fail \
            -H "Title: Wilson Monitor ERROR" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Wilson 신상품 모니터 실행에 실패했습니다. GitHub Actions를 확인하세요." \
            "https://ntfy.sh/$NTFY_TOPIC"
