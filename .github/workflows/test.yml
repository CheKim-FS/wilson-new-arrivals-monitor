name: Test Wilson Monitor

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests beautifulsoup4

      - name: Check Wilson mobile site
        run: python monitor.py

      - name: Send ntfy test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl \
            -H "Title: Wilson Monitor" \
            -H "Priority: high" \
            -H "Tags: baseball" \
            -d "Wilson 신상품 모니터 테스트 성공!" \
            "https://ntfy.sh/$NTFY_TOPIC"
